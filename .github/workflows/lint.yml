name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      # Syntax errors and undefined names only; notebooks are excluded because
      # they rely on %store to inject variables between notebooks.
      - run: ruff check --select E9,F63,F7,F82 src/
